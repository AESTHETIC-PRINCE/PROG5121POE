name: Java CI

on:
  push:
    branches: [ main, KhanbanTasks ]
  pull_request:
    branches: [ main, KhanbanTasks ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit 4 jar
        run: |
          wget https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          wget https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile source files
        run: |
          mkdir -p out
          javac -d out Login.java Message.java App.java

      - name: Compile tests
        run: |
          javac -cp out:junit-4.13.2.jar -d out LoginTest.java MessageTest.java

      - name: Run tests
        run: |
          java -cp out:junit-4.13.2.jar:hamcrest-core-1.3.jar org.junit.runner.JUnitCore prog5121.LoginTest prog5121.MessageTest
