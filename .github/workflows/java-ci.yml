name: Java CI

on:
  push:
    branches: [ main, KhanbanTasks ]
  pull_request:
    branches: [ main, KhanbanTasks ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit
        run: |
          wget -q https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          wget -q https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Set up folder structure
        run: mkdir -p src/prog5121poe out

      - name: Copy all files
        run: |
          cp Login.java Message.java App.java src/prog5121poe/
          cp LoginTest.java MessageTest.java src/prog5121poe/

      - name: Compile Login
        run: javac -d out src/prog5121poe/Login.java

      - name: Compile Message
        run: javac -d out -cp out src/prog5121poe/Message.java

      - name: Compile App
        run: javac -d out -cp out src/prog5121poe/App.java

      - name: Compile Tests
        run: |
          javac -cp out:junit-4.13.2.jar -d out src/prog5121poe/LoginTest.java
          javac -cp out:junit-4.13.2.jar -d out src/prog5121poe/MessageTest.java

      - name: Run tests
        run: |
          java -cp out:junit-4.13.2.jar:hamcrest-core-1.3.jar \
            org.junit.runner.JUnitCore \
            prog5121poe.LoginTest \
            prog5121poe.MessageTest
